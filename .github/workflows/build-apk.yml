name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Web Assets
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyDajtoLwBLW1iOplCcKYsyhXn2qsgbVWLU"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "nicutracks.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "nicutracks"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "nicutracks.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "384409007218"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:384409007218:web:2a0972395c856f56c07eeb"

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Sync Capacitor Web Assets
        run: npx cap sync android --verbose || (echo "==== CAPACITOR DIAGNOSTICS ====" && npx cap doctor && exit 1)

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rims-nicu-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
